// parity_arm.cfg — issue #20 test harness: kippo quad run (demo sha eb7f44…9081)
// with the hub-parity HUD layer. Same arm pattern as clipsmith_kippo_quad.cfg
// (re_trigger on "matchdate:" because demo_jump/track need cls.state ==
// ca_active; f_demostart fires too early) plus the multi-POV-run gotchas:
// autotrack zeroed BEFORE the seek, console suppressed in the exec'd cfg.
cfg_save_onquit 0
demo_capture_fps 30
demo_capture_dir capture

// base view settings (parity_hud.cfg overrides fov/crosshair on purpose)
fov 100
crosshair 1

// autotrack must be dead before the seek — Cam_Lock clears its own lock flag
// (cl_cam.c:202) and MVD autotrack re-locks its own pick otherwise
mvd_autotrack 0
demo_autotrack 0
cl_hightrack 0
con_notify 0

// the parity layer (the actual issue #20 deliverable)
exec parity_hud.cfg

alias w5 "wait; wait; wait; wait; wait"
alias w25 "w5; w5; w5; w5; w5"
alias clipsmith_arm "re_trigger_disable clipsmith_arm; echo CLIPSMITH_ARMED; exec parity_capgo.cfg"
re_trigger clipsmith_arm "matchdate:"
alias f_demoend "echo CLIPSMITH_DEMOEND"
echo parity_arm_loaded
playdemo demos/cs_eb7f447ac8f7.mvd
