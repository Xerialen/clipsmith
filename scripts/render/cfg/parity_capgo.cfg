// parity_capgo.cfg — exec'd from the parity_arm re_trigger alias: exec inserts
// into cbuf_main, which is NOT trigger-restricted — track / demo_jump /
// demo_capture are blocked in trigger context (cmd.c:1762) but legal here.
//
// track 58 (kippo) AFTER the seek lands — multi-POV finding: tracking set
// before demo_jump does not stick. Capture 45 s from t=726 so both hub
// ground-truth moments (t≈741 quad grab, t≈768 mid-run) fall inside the
// window under either demo_jump-timebase interpretation.
echo CLIPSMITH_SEEK
demo_jump 726
w25
w25
track 58
w5
toggleconsole
demo_capture start 45
echo CLIPSMITH_CAPSTART
