// parity_hud.cfg — clipsmith issue #20: hub-parity HUD layer
//
// LAYERED config. Exec this AFTER the working base capture cfg — it assumes
// the base already handles: classic renderer (+set vid_renderer 0), console
// suppression (toggleconsole + con_notify 0), the trigger->exec seek pattern,
// autotrack zeroing, track-after-seek, and demo_capture settings. This file
// ONLY adds/overrides HUD/view parity cvars. It overrides the base's
// `fov 100` and `crosshair 1` on purpose (hub values win).
//
// Parity target: hub.quakeworld.nu demo player =
//   FTE-engine layer: local-hub frontend/public/assets/fte/config_v5.cfg
//     (itself a port of vikpe's ezQuake streambot cfg) + ezhud plugin
//     (plug_sbar 3) — so the hud_* block below ports back nearly verbatim.
//   React layer: PlayerInfo.tsx (right-hand team+enemy status panel),
//     Participants.tsx + GameClock.tsx (top banner) — reproduced below with
//     hud_teaminfo (show_enemies, MVD-only), hud_teamfrags, hud_gameclock.
//
// FTE-only artifacts replaced: $_fte_margin 12 -> literal 12/-12,
// $_fte_weapon_scale -> 1.5, plug_sbar 3 -> scr_newhud 1 + cl_sbar 0.


// ---------------------------------------------------------------------------
// New-HUD framework. scr_newhud defaults to 0 (cl_screen.c:107) and nothing
// force-enables it in demo playback, so set it explicitly. (cl_screen.c:466
// only suppresses the net-lag icon during demos.) The hub draws no classic
// status bar and no over-head player IDs (scr_autoid default is 5 and WOULD
// draw in demo playback — SCR_DrawAutoID gate, hud_autoid.c:407).
// ---------------------------------------------------------------------------
scr_newhud 1
cl_sbar 0
viewsize 120
scr_autoid 0


// ---------------------------------------------------------------------------
// SUPPRESS nQuake's own HUD (issue #20 third root cause). The config.cfg
// exec'd before us is a full custom HUD that leaves many elements at _show 1
// which are NOT part of the hub layout and litter the frame: hud_clock
// (config.cfg:145, the faint ":21"/clock at the left edge), hud_frags
// (shownames 1 :182, pos -540/-445 — the "RUST/AG" name list clipping at the
// right edge), plus status bars, an items clock, centerprint/notify text and
// a classic hud_tracker that fights our r_tracker. None are overridden by the
// parity layout, so they draw on top of it. Disable them explicitly.
hud_clock_show 0
hud_frags_show 0
hud_bar_armor_show 0
hud_bar_health_show 0
hud_score_bar_show 0
hud_score_team_show 0
hud_score_enemy_show 0
hud_score_difference_show 0
hud_itemsclock_show 0
hud_tracker_show 0
hud_centerprint_show 0
hud_notify_show 0
hud_net_show 0
hud_netgraph_show 0
hud_netproblem_show 0
hud_ping_show 0
hud_speed_show 0


// ---------------------------------------------------------------------------
// View — hub config_v5.cfg: fov 120, r_drawviewmodel 0.6 (translucent gun).
// (FTE's r_viewmodel_fov 100 has no ezQuake equivalent — minor gun-shape
// difference, accepted.)
// ---------------------------------------------------------------------------
fov 120
r_drawviewmodel 0.6


// ---------------------------------------------------------------------------
// Crosshair — hub uses crosshairimage xtm_dot (green dot, size 4). The image
// asset is not shipped in the render basedir, so use the nearest builtin
// shape with the same color.
// ---------------------------------------------------------------------------
crosshair 2
crosshaircolor "0 255 0"
crosshairsize 2


