// ---------------------------------------------------------------------------
// QTV-style teaminfo, right side — replaces the hub's React PlayerInfo.tsx
// panel (per-player row: powerups | name | [loc] | armor/health | best
// weapon | frags, grouped per team with a team-name+frags header).
//
// hud_teaminfo.c:156 — enemies are drawn ONLY during MVD playback when
// show_enemies=1; Update_TeamInfo() (line 835) then fills health/armor/
// items/ammo for ALL players straight from the demo's stats at ~1 Hz.
// show_headers=1 adds the per-team "name ... frags" header rows
// (hud_teaminfo.c:210-224). Layout tokens mirror the hub row 1:1
// (%p powerups / %n name / $x10%l$x11 gold-bracketed location / %a colored
// armor / %h health (red <25, matches hub low-health threshold) /
// %w best-weapon text / %f frags).
// armor_style 3 = colored armor value, powerup_style 3 = colored Q/P/R
// letters — both exactly the hub's rendering.
// ---------------------------------------------------------------------------
hud_teaminfo_show 1
hud_teaminfo_place "screen"
hud_teaminfo_align_x "right"
hud_teaminfo_align_y "center"
hud_teaminfo_pos_x "-8"
hud_teaminfo_pos_y "40"
// align_right MUST stay 0. The element box is already right-anchored by
// align_x "right" + place "screen" (HUD_PrepareDraw sets x to
// screen_w - box_w - 8). hud_teaminfo_align_right then re-shifts x LEFT by
// width * FONTWIDTH * scale (hud_teaminfo.c:206) — but `width` there is
// ALREADY a pixel value (SCR_HudDrawTeamInfoPlayer returns x-x_in,
// hud_teaminfo.c:654), so multiplying it by FONTWIDTH(8)*scale again throws
// the panel hundreds of px off the LEFT edge. That double-shift is what
// produced the stray ":21"/":nn" fragments at the left-middle of the frame
// in the failing run. Right-align via align_x alone.
hud_teaminfo_align_right 0
hud_teaminfo_layout "%p%n $x10%l$x11 %a/%h %w %f"
hud_teaminfo_show_enemies 1
hud_teaminfo_show_self 2
hud_teaminfo_show_headers 1
hud_teaminfo_header_spacing 1
hud_teaminfo_armor_style 3
hud_teaminfo_powerup_style 3
hud_teaminfo_weapon_style 1
hud_teaminfo_low_health 25
hud_teaminfo_loc_width 5
hud_teaminfo_name_width 10
hud_teaminfo_show_ammo 0
hud_teaminfo_scale 1
hud_teaminfo_proportional 0
// config.cfg:547 set hud_teaminfo_item_opacity "0." (fully transparent) — the
// panel was drawing at the right spot all along ("shown, drawn", offset
// -8/40) but invisible. Draw_SetOverallAlpha(opacity) wraps the element
// (hud.c:1507), so opacity 0 = nothing rendered. Restore to 1.
hud_teaminfo_item_opacity 1


