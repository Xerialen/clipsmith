// ---------------------------------------------------------------------------
// Bottom-center MQWCL-style status HUD — direct port of the hub's
// config_v5.cfg hud_* block (lines 141-329; FTE ezhud == port of this exact
// ezQuake element set, names/sub-cvars identical). Reproduces: armor icon +
// colored armor value + face + health + ammo icon + ammo value (group1),
// owned-weapons row with per-gun ammo (group3, guns 3/5/6/7/8 @1.5x),
// powerup row quad/pent/ring/keys/sigils (group2), and the
// "team name" tracking line above it.
//
// CRITICAL — RE-ENABLE HIDDEN CHAIN ANCHORS (issue #20 root cause).
// The nQuake config.cfg exec'd before this file leaves several status
// elements at _show 0 (its own custom HUD): hud_iarmor_show 0
// (config.cfg:379), hud_quad_show 0 (:442), hud_ring_show 0 (:453),
// hud_pent_show 0 (:426). These are the PARENTS of the whole bottom block:
// HUD_DrawObject() draws a parent first and, if the parent is hidden,
// "refuses to draw" every child (hud.c:1492-1502 — child bails when
// place_hud->last_draw_sequence < host_screenupdatecount, and a hidden
// parent never updates that sequence because HUD_DrawObject returns early
// at hud.c:1452 on !HUD_ShouldShow). Our chain hangs the entire MQWCL
// block off iarmor (armor->iarmor, face->armor, health->face,
// iammo->health...) and the powerup row off quad (pent/ring/key/sigil),
// so a single hidden anchor blanked both. Re-assert show=1 explicitly.
// (group1/2/3 default show=0 too — hud_groups.c:209,221 — but those ARE
// set to 1 further down, so they only need the value we already give them.)
hud_iarmor_show                       "1"
hud_armor_show                        "1"
hud_face_show                         "1"
hud_health_show                       "1"
hud_iammo_show                        "1"
hud_ammo_show                         "1"
hud_quad_show                         "1"
hud_pent_show                         "1"
hud_ring_show                         "1"
hud_tracking_show                     "1"

// CRITICAL — ZERO LEAKED pos_x/pos_y (issue #20 second root cause).
// The nQuake config.cfg pins large pixel offsets on these same elements for
// its own absolute-positioned HUD (e.g. hud_armor_pos_y 107 config.cfg:96,
// hud_quad_pos_x 478 / pos_y -268 :439-440, hud_health_pos_y 107 :323,
// hud_face_pos_y 111 :160, hud_iammo*/ammo*/gun* offsets :336-364,:262-313,
// hud_pent_pos_x 250 :424, hud_ring -3/-3 :450-451). pos_x/pos_y are ADDED
// on top of the place-chain origin (hud.c:1083 `x += pos_x->value`, :1111
// `y += pos_y->value`), so a leaked 107/-268/478 flings each element far off
// its chained anchor — that is why every element reported "shown, drawn" yet
// the bottom block was invisible (armor/health landed ~107px below the 720
// screen, quad 268px above group2, etc.). We re-place these onto their
// chain parents above, so their offset MUST be 0 unless we deliberately nudge
// it. Zero them all here; the few intentional nudges are re-applied below.
hud_armor_pos_y                       "0"
hud_health_pos_y                      "0"
hud_face_pos_y                        "0"
hud_iarmor_pos_x                      "0"
hud_iarmor_pos_y                      "0"
hud_iammo_pos_y                       "0"
hud_iammo1_pos_x                      "0"
